# Builds the Plato application image from a pushed GitHub commit and updates
# the Cloud Run service's app-container while preserving the AI Studio ingress
# sidecar, VPC egress, Cloud SQL settings, and Secret Manager bindings.
#
# Every push to main runs this through the `plato-main` webhook trigger in
# us-east1, which holds an inline copy of this file: after editing it, run
# deploy/cloudrun/configure.sh to refresh the trigger's copy.
#
# Lint and tests (including the PostgreSQL suite) gate the build: :latest is
# pushed only after the new revision serves traffic.
#
# To deploy a pushed commit by hand:
#
#   gcloud builds submit --no-source --project=idk-4e9b9 --region=us-east1 \
#     --config=deploy/cloudrun/cloudbuild.yaml \
#     --substitutions=_SHA="$(git rev-parse HEAD)"

substitutions:
  _SHA: ""
  _REGION: us-east1
  _IMAGE: us-east1-docker.pkg.dev/idk-4e9b9/plato/app
  _SERVICE: plato-shaped

serviceAccount: projects/idk-4e9b9/serviceAccounts/plato-deploy@idk-4e9b9.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  # The webhook trigger also passes _REF, which only its filter reads.
  substitutionOption: ALLOW_LOOSE

steps:
  - id: source
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        if ! [[ "${_SHA}" =~ ^[0-9a-f]{40}$ ]] || [ "${_SHA}" = "0000000000000000000000000000000000000000" ]; then
          echo "_SHA (a valid 40-character commit SHA to deploy) is required; got '${_SHA}'" >&2
          exit 1
        fi
        git init -q .
        git remote add origin https://github.com/henryperkins/googleplato.git
        git fetch -q --depth=1 origin "${_SHA}"
        git checkout -q FETCH_HEAD

  # Disposable PostgreSQL for the test gate, reachable as plato-test-pg on the
  # build network. Steps share the /workspace checkout from `source`.
  - id: test-db
    name: gcr.io/cloud-builders/docker
    waitFor: [source]
    args:
      - run
      - -d
      - --network=cloudbuild
      - --name=plato-test-pg
      - -e
      - POSTGRES_PASSWORD=plato-test
      - postgres:17-bookworm

  - id: test-db-ready
    name: postgres:17-bookworm
    entrypoint: bash
    waitFor: [test-db]
    args:
      - -c
      - 'for i in $(seq 1 60); do pg_isready -q -h plato-test-pg -U postgres && exit 0; sleep 1; done; exit 1'

  - id: test
    name: node:24-bookworm-slim
    entrypoint: bash
    waitFor: [test-db-ready]
    env: [POSTGRES_TEST_URL=postgres://postgres:plato-test@plato-test-pg:5432/postgres]
    args:
      - -c
      - 'npm ci --no-audit --no-fund && npm run lint && npm test'

  - id: build
    name: gcr.io/cloud-builders/docker
    waitFor: [test]
    env: [DOCKER_BUILDKIT=1]
    args:
      - build
      - --cache-from=${_IMAGE}:latest
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --tag=${_IMAGE}:${_SHA}
      - --tag=${_IMAGE}:latest
      - .

  - id: push-sha
    name: gcr.io/cloud-builders/docker
    waitFor: [build]
    args: [push, "${_IMAGE}:${_SHA}"]

  - id: deploy-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    waitFor: [push-sha]
    args:
      - -c
      - |
        set -eu
        gcloud run services update "${_SERVICE}" \
          --region="${_REGION}" \
          --revision-suffix="" \
          --cpu-boost \
          --max=1 \
          --quiet \
          --container=app-container \
          --image="${_IMAGE}:${_SHA}" \
          --update-env-vars="RELEASE_COMMIT=${_SHA}" \
          --startup-probe=tcpSocket.port=3000,periodSeconds=1,timeoutSeconds=1,failureThreshold=240
        gcloud run services update-traffic "${_SERVICE}" \
          --region="${_REGION}" \
          --clear-tags \
          --to-latest \
          --quiet

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    waitFor: [deploy-service]
    args: [push, "${_IMAGE}:latest"]
