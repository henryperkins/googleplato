name: Test

# Runs `npm test` for both workspaces on every PR (drafts included — tests are
# cheap and catching a regression early is the point) and on every push to a
# protected branch. Independent of the AI Code Review workflow: that one runs
# tests inside its prep step but soft-swallows failures (the agent is supposed
# to flag them in its review). This workflow makes the test outcome a
# first-class status check that gates the PR regardless of whether the AI
# review fires.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [main, playground]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [client, server]
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: plato-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgres://postgres:plato-test@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
      # The server suite's upgrade gate runs Beta-RC-232's own route handlers
      # (server/tests/migrations/upgrade-from-rc232.test.js). The checkout is
      # shallow and this fork has no tags, so fetch that pinned commit, which
      # main contains. Under CI the gate fails, rather than skips, without it.
      - if: matrix.workspace == 'server'
        working-directory: .
        run: git fetch --no-tags --depth=1 origin 629c77811985085b88dacabe1514b2f221eb0859
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm test
